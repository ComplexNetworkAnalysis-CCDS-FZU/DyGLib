# SignDyG 修订实验 conda 环境配置
# 使用:
#   conda env create -f environment.yaml
# 注意: torch 请按服务器 CUDA 版本单独安装（pip 默认可能装 CPU 版），例如:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
name: signdyg
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy
  - pandas
  - tqdm
  - scikit-learn
  - pydantic>=2
  - tabulate
  - scipy
  - pip:
      - pydantic-argparse
